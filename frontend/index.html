<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 확인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>🌦️ 날씨 확인</h1>

    <form id="weather-form" class="search">
      <input id="city-input" type="text" placeholder="도시 이름 (예: 서울, Tokyo)" autocomplete="off">
      <button id="search-button" type="submit">날씨 확인</button>
    </form>

    <p id="message" class="message"></p>

    <section id="result" class="result hidden">
      <h2 id="city-name"></h2>
      <div id="weather-icon" class="icon"></div>
      <div id="temperature" class="temperature"></div>
      <div id="description" class="description"></div>

      <ul class="details">
        <li><span>체감 온도</span><strong id="feels-like"></strong></li>
        <li><span>습도</span><strong id="humidity"></strong></li>
        <li><span>풍속</span><strong id="wind-speed"></strong></li>
      </ul>

      <p id="updated-time" class="updated"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
